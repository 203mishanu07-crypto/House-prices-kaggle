[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "House_prices_kaggle"
version = "0.0.1"
description = "Kaggle House pricing begginers competition (Block 2 final prodject)"
authors = [
  { name = "-" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = "==3.13.5"


[tool.ruff]
line-length = 99
src = ["src"]
include = ["pyproject.toml", "House_prices_kaggle/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["src"]
force-sort-within-sections = true

